services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: toyjoy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Docker}
      POSTGRES_DB: toyjoy
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - toyjoy_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toyjoy -d toyjoy"]
      interval: 5s
      retries: 10
volumes:
  toyjoy_data:
